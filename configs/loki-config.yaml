# 阶段7-4：Loki v3 最小配置（单机模式, tsdb schema v13）
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /tmp/loki3
  storage:
    filesystem:
      chunks_directory: /tmp/loki3/chunks
      rules_directory: /tmp/loki3/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: false
